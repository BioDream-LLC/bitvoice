# Every push to main and every pull request: the Go tests on Linux (SQLite and PostgreSQL, race detector),
# Windows and macOS; the web interface's type check, unit tests and build (the committed bundle must match
# what the source builds); and the browser tests in Chromium against the real binary.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27.1'

jobs:
  linux:
    name: Go on Linux (SQLite and PostgreSQL, race)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bv
          POSTGRES_PASSWORD: bvtest
          POSTGRES_DB: bitvoice
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bv" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      BITVOICE_TEST_POSTGRES: postgres://bv:bvtest@127.0.0.1:5432/bitvoice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet (Linux, Windows, macOS)
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...
      - name: go test -race
        run: go test -race -count=1 -timeout 25m ./...

  windows:
    name: Go on Windows
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go test
        run: go test -count=1 -timeout 30m ./...
      - name: the program starts and answers
        shell: pwsh
        run: |
          go build -o bitvoice.exe ./cmd/bitvoice
          $p = Start-Process -FilePath .\bitvoice.exe -ArgumentList '-data',"$env:RUNNER_TEMP\bv",'-no-browser','-https','127.0.0.1:8443' -PassThru -RedirectStandardOutput out.log -RedirectStandardError err.log
          try {
            for ($i = 0; $i -lt 30; $i++) {
              try { $r = Invoke-RestMethod -SkipCertificateCheck https://127.0.0.1:8443/api/health/live; if ($r.status -eq 'ok') { break } } catch { }
              Start-Sleep 1
            }
            if ($r.status -ne 'ok') { Get-Content out.log, err.log; throw 'BitVoice did not answer' }
            if ((Invoke-WebRequest -SkipCertificateCheck https://127.0.0.1:8443/ -UseBasicParsing).StatusCode -ne 200) { throw 'no web interface' }
          } finally { Stop-Process $p.Id -ErrorAction SilentlyContinue }

  macos:
    name: Go on macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go test
        run: go test -count=1 -timeout 25m ./...

  install:
    # The one-command installers, on each system, from a release built and signed here with a
    # throwaway key: installed, running as a service, refusing a tampered program, then removed.
    name: Installers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          set -eu
          go run ./cmd/bvsign -new "$RUNNER_TEMP/k" > "$RUNNER_TEMP/k.pub"
          case "$RUNNER_OS" in Linux) plat=linux/amd64 ;; macOS) plat=darwin/arm64 ;; esac
          make release VERSION=v9.9.9 SIGNING_KEY="$RUNNER_TEMP/k" PLATFORMS=$plat DIST="$RUNNER_TEMP/rel"
          export BITVOICE_FROM="$RUNNER_TEMP/rel" BITVOICE_RELEASE_KEY="$(cat "$RUNNER_TEMP/k.pub")" BITVOICE_REQUIRE_SIGNATURE=1
          if [ "$RUNNER_OS" = Linux ]; then
            sh deploy/install.sh
            systemctl is-active bitvoice
            curl -fsk https://127.0.0.1/api/health/live
            journalctl -u bitvoice --no-pager | grep -q 'Setup code'
            sh deploy/install.sh   # again: an upgrade in place
            curl -fsk https://127.0.0.1/api/health/live
            url=https://127.0.0.1
          else
            export BITVOICE_DATA="$RUNNER_TEMP/bvdata"
            sh deploy/install.sh
            curl -fsk https://127.0.0.1:8443/api/health/live
          fi
          # A program changed after signing is refused, even with a matching SHA256SUMS.
          name=$(cd "$BITVOICE_FROM" && ls *.tar.gz | sed 's/\.tar\.gz$//')
          mkdir "$RUNNER_TEMP/bad" && tar -xzf "$BITVOICE_FROM/$name.tar.gz" -C "$RUNNER_TEMP/bad"
          printf x >> "$RUNNER_TEMP/bad/$name/bitvoice"
          (cd "$RUNNER_TEMP/bad" && tar -czf "$name.tar.gz" "$name" && shasum -a 256 "$name.tar.gz" > SHA256SUMS)
          if BITVOICE_FROM="$RUNNER_TEMP/bad" sh deploy/install.sh 2> err.txt; then echo "a tampered program was installed"; exit 1; fi
          grep -q 'does not match' err.txt
          sh deploy/install.sh --purge
          if [ "$RUNNER_OS" = Linux ]; then
            ! systemctl is-active bitvoice
            [ ! -e /usr/local/bin/bitvoice ] && [ ! -e /var/lib/bitvoice ]
          else
            ! curl -fsk -m 3 https://127.0.0.1:8443/api/health/live
          fi
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $t = $env:RUNNER_TEMP
          go run ./cmd/bvsign -new "$t\k" > "$t\k.pub"
          $name = 'bitvoice-v9.9.9-windows-amd64'
          New-Item -ItemType Directory "$t\rel\$name" | Out-Null
          go build -trimpath -o "$t\rel\$name\bitvoice.exe" ./cmd/bitvoice
          go run ./cmd/bvsign -key "$t\k" "$t\rel\$name\bitvoice.exe"
          Copy-Item LICENSE, NOTICE "$t\rel\$name"
          Compress-Archive "$t\rel\$name" "$t\rel\$name.zip"
          "$((Get-FileHash "$t\rel\$name.zip").Hash.ToLower())  $name.zip" | Set-Content "$t\rel\SHA256SUMS"
          $env:BITVOICE_FROM = "$t\rel"; $env:BITVOICE_RELEASE_KEY = (Get-Content "$t\k.pub").Trim(); $env:BITVOICE_REQUIRE_SIGNATURE = '1'
          # As "irm ... | iex" runs it.
          Get-Content deploy\install.ps1 -Raw | Invoke-Expression
          if ((Invoke-RestMethod -SkipCertificateCheck https://127.0.0.1:8443/api/health/live).status -ne 'ok') { throw 'not running' }
          if (-not (Get-ScheduledTask -TaskName BitVoice)) { throw 'no task' }
          # In Installed apps; the data for SYSTEM and administrators only; a second start opens the first.
          if (-not (Test-Path HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\BitVoice)) { throw 'not in Installed apps' }
          if ((icacls "$env:ProgramData\BitVoice") -match 'BUILTIN\\Users') { throw 'the data folder is open to every user' }
          $again = & "$env:ProgramFiles\BitVoice\bitvoice.exe" -data "$env:ProgramData\BitVoice" -no-browser 2>&1 | Out-String
          if ($again -notmatch 'already running') { throw "a second start did not find the first: $again" }
          # A program changed after signing is refused, even with a matching SHA256SUMS.
          New-Item -ItemType Directory "$t\bad" | Out-Null
          Expand-Archive "$t\rel\$name.zip" "$t\bad"
          Add-Content "$t\bad\$name\bitvoice.exe" 'x'
          Compress-Archive "$t\bad\$name" "$t\bad\$name.zip"
          "$((Get-FileHash "$t\bad\$name.zip").Hash.ToLower())  $name.zip" | Set-Content "$t\bad\SHA256SUMS"
          $env:BITVOICE_FROM = "$t\bad"
          try { & .\deploy\install.ps1; throw 'a tampered program was installed' } catch { if ($_.Exception.Message -notmatch 'does not match') { throw } }
          $env:BITVOICE_FROM = "$t\rel"
          # Again: an upgrade in place.
          & .\deploy\install.ps1
          if ((Invoke-RestMethod -SkipCertificateCheck https://127.0.0.1:8443/api/health/live).status -ne 'ok') { throw 'not running after the upgrade' }
          & .\deploy\install.ps1 -Purge
          if (Test-Path "$env:ProgramFiles\BitVoice") { throw 'not removed' }
          if (Test-Path HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\BitVoice) { throw 'still in Installed apps' }
          try { Invoke-RestMethod -SkipCertificateCheck -TimeoutSec 3 https://127.0.0.1:8443/api/health/live; throw 'still running' } catch { if ($_.Exception.Message -eq 'still running') { throw } }

  web:
    name: Web interface and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: type check and unit tests
        working-directory: web
        run: |
          pnpm exec tsc -p tsconfig.json --noEmit
          pnpm exec vitest run
      - name: the committed bundle is what the source builds
        run: |
          cd web && pnpm build && cd ..
          if [ -n "$(git status --porcelain internal/web/dist)" ]; then
            echo "internal/web/dist differs from what web/src builds: run make web and commit it"
            git status --short internal/web/dist
            exit 1
          fi
      - name: browser tests (Chromium)
        run: |
          # ffmpeg: recordings of callers' live video play through a copy it makes
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
          make build
          cd web && pnpm exec playwright install --with-deps chromium && pnpm exec playwright test --reporter=line
      - name: keep the failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: web/test-results
          retention-days: 7
