# BitVoice cluster lab: two servers on their own addresses, sharing one PostgreSQL, on a network of
# their own (172.30.0.0/24). Phones and the provider are started by run.sh as needed.
# Start with ./run.sh up; the servers' web pages are https://127.0.0.1:18501 and :18502.
name: bvlab
networks:
  lab:
    ipam:
      config: [{ subnet: 172.30.0.0/24 }]
volumes:
  bv1: {}
  bv2: {}
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: bv, POSTGRES_PASSWORD: labpass, POSTGRES_DB: bitvoice }
    networks: { lab: { ipv4_address: 172.30.0.5 } }
    healthcheck: { test: ["CMD", "pg_isready", "-U", "bv"], interval: 1s, retries: 30 }
  bv1: &bv
    build: .
    image: bitvoice-lab
    # The shared address is added to the interface and announced by ARP: these two capabilities.
    cap_add: [NET_ADMIN, NET_RAW]
    command: [-data, /data, -no-browser, -https, "0.0.0.0:8443", -sip, "0.0.0.0:5060",
              -database, "postgres://bv:labpass@172.30.0.5:5432/bitvoice?sslmode=disable"]
    volumes: [bv1:/data]
    ports: ["127.0.0.1:18501:8443"]
    networks: { lab: { ipv4_address: 172.30.0.11 } }
    depends_on: { db: { condition: service_healthy } }
  bv2:
    <<: *bv
    volumes: [bv2:/data]
    ports: ["127.0.0.1:18502:8443"]
    networks: { lab: { ipv4_address: 172.30.0.12 } }
