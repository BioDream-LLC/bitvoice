#cloud-config
# Turns a plain Ubuntu or Debian virtual machine on AWS EC2 or Azure into a BitVoice server: pass this as
# user data. It runs the one-command installer (deploy/install.sh), which checks the release's SHA-256 and
# BioDream's signature before installing; BITVOICE_VERSION picks a release (empty: the latest). The setup
# wizard then runs at https://<the machine's address>/ ; read its setup code with:
#   sudo journalctl -u bitvoice | grep "Setup code"
runcmd:
  - [ sh, -c, 'curl -fsSL https://raw.githubusercontent.com/BioDream-LLC/bitvoice/main/deploy/install.sh -o /root/bitvoice-install.sh && BITVOICE_VERSION="BITVOICE_VERSION_VALUE" sh /root/bitvoice-install.sh' ]
