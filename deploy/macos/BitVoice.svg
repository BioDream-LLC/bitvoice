<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- BitVoice's Mac icon: the logo (web/public/favicon.svg) on macOS's icon grid
       (an 824-unit rounded square in a 1024 canvas). deploy/macos/icon.sh makes BitVoice.icns from it. -->
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="5" y1="8" x2="27" y2="24">
      <stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141E33"/><stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <filter id="s" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#s)"/>
  <g transform="translate(128 128) scale(24)" fill="none">
    <path d="M7,17c0,-5 4,-9 9,-9s9,4 9,9" stroke="url(#g)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M7,16h1a2,2 0,0 1,2 2v4a2,2 0,0 1,-2 2h-1a2,2 0,0 1,-2 -2v-4a2,2 0,0 1,2 -2z" fill="url(#g)"/>
    <path d="M24,16h1a2,2 0,0 1,2 2v4a2,2 0,0 1,-2 2h-1a2,2 0,0 1,-2 -2v-4a2,2 0,0 1,2 -2z" fill="url(#g)"/>
    <path d="M13,20h1.5l1.5,-4 2,8 1.5,-4H21" stroke="#34D399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
