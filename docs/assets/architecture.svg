<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 440" width="1180" height="440" role="img"
     aria-label="BitVoice sits between phone carriers, the ESInet, radio systems and phones on one side, and the people answering, CAD, records and Teams or CRMs on the other. In the middle it routes, queues, records, logs and converts codecs.">
  <title>Where BitVoice sits</title>
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e293b"/><stop offset="55%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#38bdf8"/><stop offset="55%" stop-color="#818cf8"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="inL" gradientUnits="userSpaceOnUse" x1="260" y1="0" x2="440" y2="0"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#818cf8"/></linearGradient>
    <linearGradient id="inR" gradientUnits="userSpaceOnUse" x1="740" y1="0" x2="920" y2="0"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#818cf8"/></marker>
    <style>
      .box { font: 600 15px system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f172a; }
      .under { font: 15px system-ui, -apple-system, Segoe UI, sans-serif; fill: #475569; }
      .name { font: 800 34px system-ui, -apple-system, Segoe UI, sans-serif; fill: #e2e8f0; }
      .step { font: 600 15px system-ui, -apple-system, Segoe UI, sans-serif; fill: #c7d2fe; }
      .tag { font: 700 15px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #34d399; }
    </style>
  </defs>
<rect x="20" y="30" width="240" height="76" rx="14" fill="url(#box)" stroke="#cbd5e1" filter="url(#lift)"/><text class="box" x="40" y="62">Phone carriers</text><text class="under" x="40" y="86">SIP trunks, T.38</text>
<path d="M262 68 C 340 68, 360 220, 436 220" fill="none" stroke="url(#inL)" stroke-width="3" marker-end="url(#tip)" marker-start="url(#tip)"/>
<rect x="20" y="130" width="240" height="76" rx="14" fill="url(#box)" stroke="#cbd5e1" filter="url(#lift)"/><text class="box" x="40" y="162">ESInet</text><text class="under" x="40" y="186">NENA i3, PIDF-LO</text>
<path d="M262 168 C 340 168, 360 220, 436 220" fill="none" stroke="url(#inL)" stroke-width="3" marker-end="url(#tip)" marker-start="url(#tip)"/>
<rect x="20" y="230" width="240" height="76" rx="14" fill="url(#box)" stroke="#cbd5e1" filter="url(#lift)"/><text class="box" x="40" y="262">Radio systems</text><text class="under" x="40" y="286">P25 ISSI, RoIP</text>
<path d="M262 268 C 340 268, 360 220, 436 220" fill="none" stroke="url(#inL)" stroke-width="3" marker-end="url(#tip)" marker-start="url(#tip)"/>
<rect x="20" y="330" width="240" height="76" rx="14" fill="url(#box)" stroke="#cbd5e1" filter="url(#lift)"/><text class="box" x="40" y="362">Desk phones, browsers</text><text class="under" x="40" y="386">SIP, WebRTC</text>
<path d="M262 368 C 340 368, 360 220, 436 220" fill="none" stroke="url(#inL)" stroke-width="3" marker-end="url(#tip)" marker-start="url(#tip)"/>
<rect x="920" y="30" width="240" height="76" rx="14" fill="url(#box)" stroke="#cbd5e1" filter="url(#lift)"/><text class="box" x="940" y="62">People answering</text><text class="under" x="940" y="86">agents, call-takers, dispatchers</text>
<path d="M744 220 C 820 220, 840 68, 918 68" fill="none" stroke="url(#inR)" stroke-width="3" marker-end="url(#tip)" marker-start="url(#tip)"/>
<rect x="920" y="130" width="240" height="76" rx="14" fill="url(#box)" stroke="#cbd5e1" filter="url(#lift)"/><text class="box" x="940" y="162">CAD</text><text class="under" x="940" y="186">ALI spill, EIDO, radio events</text>
<path d="M744 220 C 820 220, 840 168, 918 168" fill="none" stroke="url(#inR)" stroke-width="3" marker-end="url(#tip)" marker-start="url(#tip)"/>
<rect x="920" y="230" width="240" height="76" rx="14" fill="url(#box)" stroke="#cbd5e1" filter="url(#lift)"/><text class="box" x="940" y="262">Records</text><text class="under" x="940" y="286">recordings, i3 log, S3, Azure</text>
<path d="M744 220 C 820 220, 840 268, 918 268" fill="none" stroke="url(#inR)" stroke-width="3" marker-end="url(#tip)" marker-start="url(#tip)"/>
<rect x="920" y="330" width="240" height="76" rx="14" fill="url(#box)" stroke="#cbd5e1" filter="url(#lift)"/><text class="box" x="940" y="362">Teams and CRMs</text><text class="under" x="940" y="386">Direct Routing, caller cards</text>
<path d="M744 220 C 820 220, 840 368, 918 368" fill="none" stroke="url(#inR)" stroke-width="3" marker-end="url(#tip)" marker-start="url(#tip)"/>
<rect x="440" y="60" width="300" height="320" rx="26" fill="url(#core)" stroke="url(#edge)" stroke-width="3" filter="url(#glow)"/>
  <g transform="translate(560,84) scale(0.62)">
    <path d="M21 51c0-15 12-27 27-27s27 12 27 27" fill="none" stroke="url(#edge)" stroke-width="6" stroke-linecap="round"/>
    <rect x="15" y="48" width="15" height="24" rx="6" fill="url(#edge)"/><rect x="66" y="48" width="15" height="24" rx="6" fill="url(#edge)"/>
    <path d="M36 60h5l4.5-12 6 24 4.5-12H61" fill="none" stroke="#34d399" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text class="name" x="590" y="178" text-anchor="middle">BitVoice</text>
  <text class="tag" x="590" y="204" text-anchor="middle">one Go binary</text>
<text class="step" x="590" y="240" text-anchor="middle">route and queue</text>
<text class="step" x="590" y="266" text-anchor="middle">record and log</text>
<text class="step" x="590" y="292" text-anchor="middle">convert codecs</text>
<text class="step" x="590" y="318" text-anchor="middle">encrypt (SRTP, P25)</text>
<text class="step" x="590" y="344" text-anchor="middle">the web interface</text>
</svg>
